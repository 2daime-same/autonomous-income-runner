name: Probe agent-market inventory routes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - inventory_path_probe.py
      - .github/workflows/inventory-path-probe.yml
  schedule:
    - cron: '43 */3 * * *'

permissions:
  contents: write

concurrency:
  group: inventory-path-probe
  cancel-in-progress: true

jobs:
  probe:
    if: github.repository_owner == 'nexaworks-jp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Compile inventory route probe
        run: python3 -m py_compile inventory_path_probe.py

      - name: Extract and fetch public inventory routes
        env:
          INVENTORY_PATH_OUTPUT: market-output/inventory-paths.json
        run: python3 inventory_path_probe.py

      - name: Reject credential-like output
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('market-output/inventory-paths.json').read_text(encoding='utf-8')
          patterns = [
              r'\b(?:sk|pk|api|key|token)_[A-Za-z0-9_-]{16,}\b',
              r'(?i)"(?:api[_-]?key|authorization|bearer|token|secret|private[_-]?key|claim[_-]?code)"\s*:\s*"(?!\[REDACTED\])',
              r'\b0x[a-fA-F0-9]{64}\b',
          ]
          hits = [pattern for pattern in patterns if re.search(pattern, text)]
          if hits:
              raise SystemExit(f'credential-like output detected: {hits}')
          PY

      - name: Commit sanitized route evidence
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add market-output/inventory-paths.json
          if git diff --cached --quiet; then
            echo 'No route evidence changes'
          else
            git commit -m 'Refresh agent market inventory routes [skip ci]'
            git pull --rebase origin main
            git push
          fi
