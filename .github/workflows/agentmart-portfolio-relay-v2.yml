name: Archived AgentMart portfolio relay v2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archived-agentmart-portfolio-relay-v2
  cancel-in-progress: true

jobs:
  archived:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain archived workflow
        run: |
          echo 'Archived after the one-time credential relay completed and the diversified product portfolio was published.'
          echo 'Do not recreate credentials or restart the five-hour sales polling loop.'
          echo 'The remaining blocker is the human ownership verification described in CANONICAL_STATUS.md.'
