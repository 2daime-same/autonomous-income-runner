name: ClawGig autonomous income runner

on:
  push:
    branches: [main]
    paths:
      - clawgig/request.json
      - clawgig/input/verify-code.cms.b64
      - clawgig_runner.py
      - tests/test_clawgig_runner.py
      - clawgig/avatar.svg
      - .github/workflows/clawgig.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clawgig-agent-main
  cancel-in-progress: false

jobs:
  run:
    if: github.repository_owner == 'nexaworks-jp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out dedicated repository
        uses: actions/checkout@v4

      - name: Restore private ClawGig state
        uses: actions/cache/restore@v4
        with:
          path: .clawgig-state
          key: clawgig-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            clawgig-state-

      - name: Create persistent transport key if absent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .clawgig-state clawgig/output
          if [[ ! -f .clawgig-state/transport-private.pem || ! -f .clawgig-state/transport-public.crt ]]; then
            openssl req -x509 -newkey rsa:3072 -sha256 -days 3650 -nodes \
              -keyout .clawgig-state/transport-private.pem \
              -out .clawgig-state/transport-public.crt \
              -subj '/CN=ClawGig Verification Transport/O=NexaWorks Agent Mission'
            chmod 600 .clawgig-state/transport-private.pem
          fi
          cp .clawgig-state/transport-public.crt clawgig/output/transport-public.crt

      - name: Decrypt email verification code when supplied
        shell: bash
        run: |
          set -euo pipefail
          operation="$(python3 -c 'import json; print(json.load(open("clawgig/request.json"))["operation"])')"
          if [[ "$operation" == "confirm" ]]; then
            test -s clawgig/input/verify-code.cms.b64
            base64 -d clawgig/input/verify-code.cms.b64 > /tmp/clawgig-code.cms
            openssl cms -decrypt -binary -inform DER \
              -in /tmp/clawgig-code.cms \
              -inkey .clawgig-state/transport-private.pem \
              -recip .clawgig-state/transport-public.crt \
              -out /tmp/clawgig-code.txt
            code="$(tr -d '\r\n ' < /tmp/clawgig-code.txt)"
            [[ "$code" =~ ^[0-9]{6}$ ]]
            echo "CLAWGIG_VERIFY_CODE=$code" >> "$GITHUB_ENV"
            rm -f /tmp/clawgig-code.cms /tmp/clawgig-code.txt
          fi

      - name: Run local safety tests
        run: python3 -m unittest discover -s tests -p 'test_clawgig_runner.py' -v

      - name: Compile runner
        run: python3 -m py_compile clawgig_runner.py

      - name: Validate request without network access
        env:
          CLAWGIG_REQUEST_FILE: clawgig/request.json
        run: python3 clawgig_runner.py --dry-run

      - name: Execute requested ClawGig operation
        id: agent
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
          CLAWGIG_STATE_DIR: .clawgig-state
          CLAWGIG_OUTPUT_DIR: clawgig/output
          CLAWGIG_REQUEST_FILE: clawgig/request.json
        run: python3 clawgig_runner.py

      - name: Encrypt private state and registration material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p clawgig/output
          if [[ -f .clawgig-state/state.json ]]; then
            openssl cms -encrypt -binary -aes-256-cbc \
              -in .clawgig-state/state.json \
              -out clawgig/output/private-state.cms \
              -outform DER keys/superteam-state-public.crt
            sha256sum clawgig/output/private-state.cms > clawgig/output/private-state.cms.sha256
          fi
          if [[ -f clawgig/output/private-registration.json ]]; then
            openssl cms -encrypt -binary -aes-256-cbc \
              -in clawgig/output/private-registration.json \
              -out clawgig/output/private-registration.cms \
              -outform DER keys/superteam-state-public.crt
            sha256sum clawgig/output/private-registration.cms > clawgig/output/private-registration.cms.sha256
            rm -f clawgig/output/private-registration.json
          fi

      - name: Verify public output contains no credentials
        id: public_scan
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          sensitive = {
              'access_token', 'api_key', 'apikey', 'authorization',
              'claim_token', 'claim_url', 'contact_email', 'email',
              'refresh_token', 'secret', 'token', 'wallet_private_key',
              'webhook_secret',
          }
          problems = []

          def walk(value, path):
              if isinstance(value, dict):
                  for raw_key, item in value.items():
                      key = str(raw_key).replace('-', '_').lower()
                      child = f'{path}.{raw_key}'
                      if key in sensitive and item not in (None, '', '[REDACTED]'):
                          problems.append(child)
                      walk(item, child)
              elif isinstance(value, list):
                  for index, item in enumerate(value):
                      walk(item, f'{path}[{index}]')
              elif isinstance(value, str):
                  if value.startswith(('cg_', 'whsec_')):
                      problems.append(path)
                  if value.startswith('https://clawgig.ai/dashboard/agents/claim/'):
                      problems.append(path)

          for file in Path('clawgig/output').glob('*.json'):
              walk(json.loads(file.read_text(encoding='utf-8')), file.name)

          if problems:
              raise SystemExit('Potential credential in public JSON: ' + ', '.join(problems))
          PY

      - name: Commit sanitized evidence and encrypted recovery state
        if: always() && steps.public_scan.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add clawgig/output
          if git diff --cached --quiet; then
            echo 'No public output changes'
          else
            git commit -m 'Record ClawGig agent result [skip ci]'
            git push
          fi

      - name: Save private ClawGig state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .clawgig-state
          key: clawgig-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve runner failure status
        if: steps.agent.outcome == 'failure'
        run: exit 1
