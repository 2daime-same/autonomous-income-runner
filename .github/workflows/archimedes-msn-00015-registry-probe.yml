name: Probe MSN-00015 public npm registry state

on:
  push:
    branches: [main]
    paths:
      - deliverables/archimedes-msn-00015/publication-evidence/registry-probe-request.json

permissions:
  contents: write

concurrency:
  group: archimedes-msn-00015-registry-probe
  cancel-in-progress: true

jobs:
  probe:
    if: github.repository == '2daime-same/autonomous-income-runner' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Poll public npm metadata without credentials
        env:
          PACKAGE: archimedes-github-pr-mcp
          VERSION: 1.0.0
        run: |
          set -euo pipefail
          VISIBLE=false
          ATTEMPTS=0
          printf '{}\n' > /tmp/npm-registry-view.json
          : > /tmp/npm-registry-view.err
          for attempt in $(seq 1 36); do
            ATTEMPTS="$attempt"
            if npm view "$PACKAGE@$VERSION" --json > /tmp/npm-registry-view.json 2>/tmp/npm-registry-view.err; then
              VISIBLE=true
              break
            fi
            sleep 10
          done
          export VISIBLE ATTEMPTS
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          try:
              metadata = json.loads(Path('/tmp/npm-registry-view.json').read_text(encoding='utf-8'))
          except json.JSONDecodeError:
              metadata = {}
          error_excerpt = Path('/tmp/npm-registry-view.err').read_text(encoding='utf-8', errors='replace')[:2000]
          visible = os.environ['VISIBLE'].lower() == 'true'
          value = {
              'schema_version': 'archimedes-msn-00015-registry-probe-v1',
              'observed_at': datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              'source_commit': os.environ['GITHUB_SHA'],
              'package': 'archimedes-github-pr-mcp',
              'version': '1.0.0',
              'registry': 'https://registry.npmjs.org',
              'visible': visible,
              'attempts': int(os.environ['ATTEMPTS']),
              'dist': metadata.get('dist') if isinstance(metadata, dict) else None,
              'metadata_name': metadata.get('name') if isinstance(metadata, dict) else None,
              'metadata_version': metadata.get('version') if isinstance(metadata, dict) else None,
              'error_excerpt': None if visible else error_excerpt,
              'commercial_status': {
                  'verified_income_jpy': 0,
                  'verified_receivable_jpy': 0,
                  'verified_spend_jpy': 0,
              },
          }
          path = Path('deliverables/archimedes-msn-00015/publication-evidence/registry-status.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(value, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Commit public registry evidence
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add deliverables/archimedes-msn-00015/publication-evidence/registry-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record MSN-00015 public npm registry state [skip ci]'
          for attempt in $(seq 1 12); do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          exit 1
