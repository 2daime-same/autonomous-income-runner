name: Probe Tetto and HYRVE marketplace contracts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tetto_hyrve_contract_probe.py
      - .github/workflows/tetto-hyrve-contract-probe.yml

permissions:
  contents: write

concurrency:
  group: tetto-hyrve-contract-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate and inspect only public marketplace resources
        run: |
          set -euo pipefail
          python3 -m py_compile tetto_hyrve_contract_probe.py
          python3 tetto_hyrve_contract_probe.py

      - name: Commit read-only contract evidence
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add market-output/tetto-hyrve-contract.json market-output/tetto-hyrve-docs.txt
          if git diff --cached --quiet; then
            echo 'No contract changes'
          else
            git commit -m 'Record Tetto and HYRVE marketplace contracts [skip ci]'
            git pull --rebase origin main
            git push
          fi
