name: Snapshot current open Archimedes bounties

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - archimedes_fast_inventory.py
      - .github/workflows/archimedes-fast-inventory.yml

permissions:
  contents: write

concurrency:
  group: archimedes-fast-open-inventory
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          package-manager-cache: false

      - name: Validate scripts
        run: python3 -m py_compile archimedes_live_search.py archimedes_fast_inventory.py

      - name: Fetch current open inventory once
        run: python3 archimedes_fast_inventory.py

      - name: Validate and commit snapshot
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('market-output/archimedes-open-summary.json').read_text())
          assert data['mode'] == 'public_read_only_one_call'
          assert data['commercial_status']['submission_performed'] is False
          assert data['commercial_status']['account_action_performed'] is False
          assert data['commercial_status']['expenses_usd'] == 0
          assert data['open_bounty_count'] == len(data['items'])
          PY
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add market-output/archimedes-open-summary.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh official Archimedes open bounty summary [skip ci]'
          for attempt in $(seq 1 12); do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          exit 1
