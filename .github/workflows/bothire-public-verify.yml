name: Verify BotHire listings and live demand

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - bothire_public_verify.mjs
      - .github/workflows/bothire-public-verify.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.repository_owner == 'nexaworks-jp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check bothire_public_verify.mjs
      - run: node bothire_public_verify.mjs
      - name: Commit public verification
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add market-output/bothire-live-verification.json
          if git diff --cached --quiet; then
            echo 'No verification changes'
          else
            git commit -m 'Record BotHire live listing verification [skip ci]'
            git pull --rebase origin main
            git push
          fi
