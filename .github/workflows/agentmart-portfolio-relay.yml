name: Archived AgentMart portfolio relay v1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archived-agentmart-portfolio-relay-v1
  cancel-in-progress: true

jobs:
  archived:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain archived workflow
        run: |
          echo 'Archived after the one-time credential relay completed and products were published.'
          echo 'Do not recreate credentials or restart long polling from this workflow.'
          echo 'Current status and required next action are documented in CANONICAL_STATUS.md.'
