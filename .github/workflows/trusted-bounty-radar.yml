name: Trusted bounty program radar

on:
  push:
    branches: [main]
    paths:
      - trusted_bounty_radar.py
      - strict_candidate_selector.py
      - github_bounty_radar.py
      - tests/test_trusted_bounty_radar.py
      - .github/workflows/trusted-bounty-radar.yml
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: trusted-bounty-radar-main
  cancel-in-progress: false

jobs:
  scan:
    if: github.repository_owner == 'nexaworks-jp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out dedicated repository
        uses: actions/checkout@v4

      - name: Test trusted program detection
        run: python3 -m unittest discover -s tests -p 'test_trusted_bounty_radar.py' -v

      - name: Compile trusted radar
        run: python3 -m py_compile trusted_bounty_radar.py strict_candidate_selector.py github_bounty_radar.py

      - name: Search traceable bounty programs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRUSTED_BOUNTY_OUTPUT: market-output/trusted-bounties.json
        run: python3 trusted_bounty_radar.py

      - name: Commit trusted candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add market-output/trusted-bounties.json
          if git diff --cached --quiet; then
            echo 'No trusted bounty changes'
          else
            git commit -m 'Refresh trusted bounty inventory [skip ci]'
            git pull --rebase origin main
            git push
          fi
