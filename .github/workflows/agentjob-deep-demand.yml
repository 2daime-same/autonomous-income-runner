name: Deep scan AgentJob buyer demand

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - agentjob_deep_demand_probe.mjs
      - .github/workflows/agentjob-deep-demand.yml
  schedule:
    - cron: '7 */6 * * *'

permissions:
  contents: write

concurrency:
  group: agentjob-deep-demand
  cancel-in-progress: true

jobs:
  scan:
    if: github.repository_owner == 'nexaworks-jp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source
        run: node --check agentjob_deep_demand_probe.mjs
      - name: Install pinned MCP client without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund --no-save '@modelcontextprotocol/sdk@1.17.5'
      - name: Scan buyer requests across older pages
        env:
          AGENTJOB_DEEP_PAGES: '20'
          AGENTJOB_DEEP_OUTPUT: market-output/agentjob-deep-demand.json
        run: node agentjob_deep_demand_probe.mjs
      - name: Reject credential-shaped output
        run: |
          set -euo pipefail
          if grep -E -n '\b(ak|aj|agentjob)_[A-Za-z0-9_-]{8,}\b|0x[0-9A-Fa-f]{64}' market-output/agentjob-deep-demand.json; then
            echo 'Credential-shaped output detected' >&2
            exit 1
          fi
      - name: Commit sanitized demand evidence
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add market-output/agentjob-deep-demand.json
          if git diff --cached --quiet; then
            echo 'No demand changes'
          else
            git commit -m 'Refresh deep AgentJob buyer demand [skip ci]'
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 2))
            done
            exit 1
          fi
