name: Repair BotHire post persistence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify the repair is already present
        run: |
          set -euo pipefail
          grep -q "existingPostLookupError" bothire_worker.mjs
          grep -q "post?._id" bothire_worker.mjs
          node --check bothire_worker.mjs
          echo 'BotHire post persistence repair is present; no mutation required.'
