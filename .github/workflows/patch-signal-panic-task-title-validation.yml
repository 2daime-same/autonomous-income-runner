name: Patch Signal Panic task-title validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-signal-panic-task-title-validation.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == '2daime-same/autonomous-income-runner' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Accept Taskmarket's description-only task shape
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('taskmarket_signal_panic_official_flow.py')
          text = path.read_text(encoding='utf-8')
          old = '''    title = str(task.get("title") or task.get("name") or "")
    if "signal panic" not in title.lower():
        raise FlowError(f"unexpected task title: {title!r}", classification="task_invalid")
'''
          new = '''    title = str(task.get("title") or task.get("name") or "")
    description = str(task.get("description") or "")
    if "signal panic" not in f"{title} {description}".lower():
        raise FlowError("Taskmarket response no longer identifies the Signal Panic brief", classification="task_invalid")
    if not title:
        title = "Signal Panic"
'''
          if text.count(old) != 1:
              raise SystemExit('expected validator block was not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m py_compile taskmarket_signal_panic_official_flow.py

      - name: Commit validator correction
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add taskmarket_signal_panic_official_flow.py
          git commit -m 'Accept description-only Taskmarket task metadata [skip ci]'
          for attempt in $(seq 1 8); do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          exit 1
