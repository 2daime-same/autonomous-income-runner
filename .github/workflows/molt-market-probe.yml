name: Probe official Molt job markets

on:
  push:
    branches: [main]
    paths:
      - molt_market_probe.py
      - .github/workflows/molt-market-probe.yml
  workflow_dispatch:
  schedule:
    - cron: '11 */6 * * *'

permissions:
  contents: write

concurrency:
  group: molt-market-probe
  cancel-in-progress: true

jobs:
  probe:
    if: github.repository_owner == 'nexaworks-jp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Compile read-only probe
        run: python3 -m py_compile molt_market_probe.py

      - name: Fetch official job APIs and skill documents
        env:
          MOLT_MARKET_OUTPUT: market-output/molt-markets.json
        run: python3 molt_market_probe.py

      - name: Reject credential-shaped output
        run: |
          set -euo pipefail
          if grep -E -n '\b(mj|mk|cph|sk)_(live|test)?_?[A-Za-z0-9_-]{12,}' market-output/molt-markets.json; then
            echo 'Credential-shaped value found in public output' >&2
            exit 1
          fi

      - name: Commit primary-source evidence
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add market-output/molt-markets.json
          if git diff --cached --quiet; then
            echo 'No Molt market evidence changes'
          else
            git commit -m 'Refresh official Molt market evidence [skip ci]'
            git pull --rebase origin main
            git push
          fi
