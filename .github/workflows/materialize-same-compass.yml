name: Materialize SAME COMPASS source

on:
  push:
    branches:
      - agent/same-compass

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/same-compass

      - name: Verify and materialize source
        run: node personal-tools/same-compass/scripts/materialize.mjs

      - name: Remove one-time transport files
        run: |
          rm -rf personal-tools/same-compass/.seed
          rm -f personal-tools/same-compass/scripts/materialize.mjs
          rmdir personal-tools/same-compass/scripts 2>/dev/null || true
          rm -f .github/workflows/materialize-same-compass.yml

      - name: Commit materialized source
        run: |
          git config user.name "same-compass-builder[bot]"
          git config user.email "same-compass-builder[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Materialize SAME COMPASS source"
          git push origin HEAD:agent/same-compass
