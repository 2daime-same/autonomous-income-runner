name: Refresh Archimedes MSN-00013 lockfile

on:
  push:
    branches:
      - agent/build-archimedes-msn-00013
    paths:
      - ".github/workflows/archimedes-msn-00013-lockfile.yml"
      - "deliverables/archimedes-msn-00013/package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archimedes-msn-00013-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate exact dependency lock
        working-directory: deliverables/archimedes-msn-00013
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile when dependency metadata changed
        run: |
          if git diff --quiet -- deliverables/archimedes-msn-00013/package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliverables/archimedes-msn-00013/package-lock.json
          git commit -m "Lock MSN-00013 dependencies [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
