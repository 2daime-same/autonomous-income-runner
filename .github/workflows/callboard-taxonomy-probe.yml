name: Probe Callboard capability taxonomy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - callboard_taxonomy_probe.py
      - .github/workflows/callboard-taxonomy-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch public capabilities and job types
        run: |
          set -euo pipefail
          python3 -m py_compile callboard_taxonomy_probe.py
          python3 callboard_taxonomy_probe.py

      - name: Verify and commit taxonomy
        run: |
          set -euo pipefail
          test -f market-output/callboard-taxonomy.json
          ! grep -Eq 'Authorization: Bearer|cb_[A-Za-z0-9._~+/=-]{8,}|0x[0-9a-fA-F]{64}' market-output/callboard-taxonomy.json
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add market-output/callboard-taxonomy.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record Callboard capability taxonomy [skip ci]'
            git pull --rebase origin main
            git push
          fi
