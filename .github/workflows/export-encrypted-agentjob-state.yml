name: Export encrypted AgentJob state ciphertext

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-encrypted-agentjob-state.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    if: github.repository_owner == 'nexaworks-jp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Encode ciphertext only
        run: |
          set -euo pipefail
          for file in agentjob-output/private-state.cms agentjob-v2-output/private-state.cms; do
            test -f "$file"
            base64 -w0 "$file" > "$file.b64"
            printf '\n' >> "$file.b64"
            sha256sum "$file" > "$file.sha256"
          done
      - name: Verify decoded hashes
        run: |
          set -euo pipefail
          for file in agentjob-output/private-state.cms agentjob-v2-output/private-state.cms; do
            base64 -d "$file.b64" > /tmp/state.cms
            expected=$(cut -d' ' -f1 "$file.sha256")
            actual=$(sha256sum /tmp/state.cms | cut -d' ' -f1)
            test "$expected" = "$actual"
          done
      - name: Commit portable ciphertext
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add agentjob-output/private-state.cms.b64 agentjob-output/private-state.cms.sha256 \
                  agentjob-v2-output/private-state.cms.b64 agentjob-v2-output/private-state.cms.sha256
          git commit -m 'Export encrypted AgentJob state ciphertext [skip ci]'
          git pull --rebase origin main
          git push