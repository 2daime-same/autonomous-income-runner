name: Earn first Clawlancer micro-bounty

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clawlancer-first-income
  cancel-in-progress: false

jobs:
  earn:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install wallet and checksum dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet 'eth-account>=0.13,<0.14' 'eth-utils>=5,<6'

      - name: Compile executor
        run: python3 -m py_compile clawlancer_earn.py

      - name: Register, claim, deliver, and monitor
        id: execute
        continue-on-error: true
        run: python3 clawlancer_earn.py

      - name: Encrypt all private state before persistence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p clawlancer-output
          if [ -f .clawlancer-state/private.json ]; then
            chmod 600 .clawlancer-state/private.json
            openssl cms -encrypt -binary -aes-256-cbc \
              -in .clawlancer-state/private.json \
              -outform DER \
              -out clawlancer-output/private-state.cms \
              keys/superteam-state-public.crt
            sha256sum clawlancer-output/private-state.cms > clawlancer-output/private-state.cms.sha256
            rm -f .clawlancer-state/private.json
          fi
          rm -rf .clawlancer-state

      - name: Recursively sanitize all public evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from collections.abc import Mapping
          from pathlib import Path

          sensitive_keys = {
              'api_key', 'apikey', 'private_key', 'privatekey', 'secret', 'token',
              'authorization', 'auth_header', 'bearer', 'mnemonic', 'seed',
              'raw_key', 'rawkey', 'heartbeat_config', 'heartbeatconfig',
              'details', 'request_body', 'signed_transaction', 'raw_transaction',
              'rpc_url', 'provider_url', 'credentials',
          }

          def sanitize(value):
              if isinstance(value, Mapping):
                  result = {}
                  for raw_key, item in value.items():
                      key = str(raw_key)
                      normalized = key.replace('-', '_').lower()
                      result[key] = '[REDACTED]' if normalized in sensitive_keys else sanitize(item)
                  return result
              if isinstance(value, list):
                  return [sanitize(item) for item in value]
              if isinstance(value, str):
                  value = re.sub(r'\b(?:clw|claw|cl|api)_[A-Za-z0-9._~+/=-]{8,}\b', '[REDACTED]', value)
                  value = re.sub(r'Authorization:\s*Bearer\s+\S+', 'Authorization: Bearer [REDACTED]', value, flags=re.I)
                  value = re.sub(r'https://[^\s\"\']*alchemy\.com/v2/[A-Za-z0-9_-]+', '[REDACTED_RPC_URL]', value, flags=re.I)
                  value = re.sub(r'\b0x[0-9a-fA-F]{128,}\b', '[REDACTED_SIGNED_TRANSACTION]', value)
                  value = re.sub(r'\b0x[0-9a-fA-F]{64}\b', '[REDACTED_PRIVATE_KEY]', value)
              return value

          for path in [Path('clawlancer-output/earn-result.json'), Path('clawlancer-output/agent-public.json')]:
              if not path.exists():
                  continue
              data = json.loads(path.read_text(encoding='utf-8'))
              temporary = path.with_suffix(path.suffix + '.tmp')
              temporary.write_text(json.dumps(sanitize(data), ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
              os.replace(temporary, path)
          PY

      - name: Fail closed on credential-like public output
        if: always()
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          public = [
              Path('clawlancer-output/earn-result.json'),
              Path('clawlancer-output/agent-public.json'),
          ]
          patterns = {
              'api key': re.compile(r'\b(?:clw|claw|cl|api)_[A-Za-z0-9._~+/=-]{8,}\b'),
              'authorization header': re.compile(r'Authorization:\s*Bearer\s+(?!\[REDACTED\])\S+', re.I),
              'Alchemy credential': re.compile(r'alchemy\.com/v2/[A-Za-z0-9_-]+', re.I),
              'signed transaction': re.compile(r'\b0x[0-9a-fA-F]{128,}\b'),
              'private key': re.compile(r'\b0x[0-9a-fA-F]{64}\b'),
              'credential field': re.compile(r'(?i)"(?:api_key|apikey|token|secret|private_key|wallet_private_key|auth_header|heartbeat_config|details)"\s*:\s*"(?!\[REDACTED)'),
          }
          for path in public:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              for name, pattern in patterns.items():
                  if pattern.search(text):
                      raise SystemExit(f'{name} found in public output {path}')
          PY

      - name: Commit sanitized execution evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add clawlancer-output/earn-result.json
          [ ! -f clawlancer-output/agent-public.json ] || git add clawlancer-output/agent-public.json
          [ ! -f clawlancer-output/private-state.cms ] || git add clawlancer-output/private-state.cms clawlancer-output/private-state.cms.sha256
          if git diff --cached --quiet; then
            echo 'No execution evidence changes'
          else
            git commit -m 'Record Clawlancer micro-bounty execution [skip ci]'
            git pull --rebase origin main
            git push
          fi

      - name: Preserve executor failure after evidence is saved
        if: steps.execute.outcome == 'failure'
        run: exit 1
