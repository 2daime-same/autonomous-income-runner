name: Record MSN-00015 first-publish validation result

on:
  workflow_run:
    workflows:
      - Validate MSN-00015 first-publish workflow
    types:
      - completed

permissions:
  contents: write
  actions: read

concurrency:
  group: record-msn15-first-publish-validation
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Record workflow result
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_STATUS: ${{ github.event.workflow_run.status }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CREATED_AT: ${{ github.event.workflow_run.created_at }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          mkdir -p deliverables/archimedes-msn-00015/publication-evidence
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          value = {
              'schema_version': 'archimedes-msn-00015-first-publish-validation-result-v1',
              'run_id': int(os.environ['RUN_ID']),
              'run_number': int(os.environ['RUN_NUMBER']),
              'run_attempt': int(os.environ['RUN_ATTEMPT']),
              'status': os.environ['RUN_STATUS'],
              'conclusion': os.environ['RUN_CONCLUSION'],
              'run_url': os.environ['RUN_URL'],
              'head_sha': os.environ['HEAD_SHA'],
              'created_at': os.environ['CREATED_AT'],
              'updated_at': os.environ['UPDATED_AT'],
              'npm_publish_executed': False,
              'commercial_effect': 'none',
          }
          Path('deliverables/archimedes-msn-00015/publication-evidence/validation-workflow-result.json').write_text(
              json.dumps(value, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Commit result
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add deliverables/archimedes-msn-00015/publication-evidence/validation-workflow-result.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record MSN-00015 first-publish validation result [skip ci]'
          for attempt in $(seq 1 12); do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          exit 1
