name: Test workflow secret persistence capability

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/test-self-secret.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  probe:
    if: github.repository_owner == 'nexaworks-jp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Attempt to create a non-sensitive probe secret
        id: write_secret
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          output=$(printf 'non-sensitive-capability-probe' | gh secret set SELF_SECRET_CAPABILITY --repo "$GITHUB_REPOSITORY" 2>&1)
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$output" | tail -c 2000 > /tmp/secret-probe-output.txt
          exit "$code"
      - name: Record result without secret material
        env:
          EXIT_CODE: ${{ steps.write_secret.outputs.exit_code }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          text = Path('/tmp/secret-probe-output.txt').read_text(errors='replace') if Path('/tmp/secret-probe-output.txt').exists() else ''
          result = {
              'generated_at': datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              'secret_write_exit_code': int(os.environ.get('EXIT_CODE') or 999),
              'secret_write_supported': os.environ.get('EXIT_CODE') == '0',
              'diagnostic': text[:2000],
              'secret_value_recorded': False,
          }
          path = Path('ops-output/secret-persistence-capability.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(result, indent=2) + '\n')
          PY
      - name: Commit capability result
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add ops-output/secret-persistence-capability.json
          git commit -m 'Record workflow secret persistence capability [skip ci]'
          git pull --rebase origin main
          git push