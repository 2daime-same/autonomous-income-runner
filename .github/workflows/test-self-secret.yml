name: Test workflow secret persistence capability

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/test-self-secret.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  probe:
    if: github.repository_owner == 'nexaworks-jp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Attempt to create a non-sensitive probe secret
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          printf 'non-sensitive-capability-probe' | gh secret set SELF_SECRET_CAPABILITY --repo "$GITHUB_REPOSITORY"
          code=$?
          echo "secret_write_exit_code=$code" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"