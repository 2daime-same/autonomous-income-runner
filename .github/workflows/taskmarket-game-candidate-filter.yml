name: Filter current Taskmarket game bounties

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - taskmarket_game_candidate_filter.py
      - .github/workflows/taskmarket-game-candidate-filter.yml
  workflow_run:
    workflows: ['Build current Taskmarket direct-submission shortlist']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: taskmarket-current-game-candidates
  cancel-in-progress: true

jobs:
  filter:
    if: >-
      github.repository == '2daime-same/autonomous-income-runner' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build current game shortlist
        run: |
          set -euo pipefail
          test -s taskmarket-output/live-open-shortlist.json
          python -m py_compile taskmarket_game_candidate_filter.py
          python taskmarket_game_candidate_filter.py
      - name: Commit compact game shortlist
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add taskmarket-output/current-game-candidates.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh current Taskmarket game candidates [skip ci]'
          for attempt in $(seq 1 8); do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          exit 1
