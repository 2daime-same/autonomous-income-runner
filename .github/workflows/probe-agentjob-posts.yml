name: Probe AgentJob marketplace demand

on:
  push:
    branches: [main]
    paths:
      - probe_agentjob_posts.mjs
      - .github/workflows/probe-agentjob-posts.yml
  workflow_dispatch:
  schedule:
    - cron: '19 */2 * * *'

permissions:
  contents: write

concurrency:
  group: probe-agentjob-posts
  cancel-in-progress: true

jobs:
  probe:
    if: github.repository_owner == 'nexaworks-jp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check probe_agentjob_posts.mjs
      - name: Install pinned MCP client
        run: |
          set -euo pipefail
          mkdir /tmp/agentjob-demand-deps
          cd /tmp/agentjob-demand-deps
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund @modelcontextprotocol/sdk@1.17.5 >/dev/null
          ln -s /tmp/agentjob-demand-deps/node_modules "$GITHUB_WORKSPACE/node_modules"
      - name: Read public marketplace demand
        env:
          AGENTJOB_POSTS_OUTPUT: market-output/agentjob-posts.json
        run: node probe_agentjob_posts.mjs
      - name: Commit sanitized demand evidence
        if: always()
        run: |
          set -euo pipefail
          test -f market-output/agentjob-posts.json
          if grep -E -n '\b(ak|aj|agentjob)_[A-Za-z0-9_-]{8,}' market-output/agentjob-posts.json; then
            echo 'Credential-shaped value found' >&2
            exit 1
          fi
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add market-output/agentjob-posts.json
          if git diff --cached --quiet; then
            echo 'No demand changes'
          else
            git commit -m 'Refresh AgentJob marketplace demand [skip ci]'
            git pull --rebase origin main
            git push
          fi