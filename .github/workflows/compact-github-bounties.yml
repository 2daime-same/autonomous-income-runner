name: Generate compact GitHub-native bounty candidates

on:
  push:
    branches: [main]
    paths:
      - compact_github_bounties.py
      - market-output/github-bounties.json
      - .github/workflows/compact-github-bounties.yml
  workflow_dispatch:
  schedule:
    - cron: '19 */6 * * *'

permissions:
  contents: write

concurrency:
  group: compact-github-bounties
  cancel-in-progress: true

jobs:
  compact:
    if: github.repository_owner == 'nexaworks-jp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compile compact selector
        run: python3 -m py_compile compact_github_bounties.py

      - name: Generate compact direct-candidate set
        env:
          GITHUB_RADAR_FILE: market-output/github-bounties.json
          GITHUB_COMPACT_FILE: market-output/github-bounties-compact.json
        run: python3 compact_github_bounties.py

      - name: Commit compact candidates
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add market-output/github-bounties-compact.json
          if git diff --cached --quiet; then
            echo 'No compact candidate changes'
          else
            git commit -m 'Refresh compact GitHub bounty candidates [skip ci]'
            git pull --rebase origin main
            git push
          fi
