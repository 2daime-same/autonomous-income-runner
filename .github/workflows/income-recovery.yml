name: Route autonomous income recovery safely

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/income-recovery.yml
      - agentgigs_resume_worker.mjs

permissions:
  contents: write

concurrency:
  group: autonomous-income-recovery
  cancel-in-progress: true

jobs:
  route-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate the resume-only AgentGigs worker
        run: |
          set -euo pipefail
          node --check agentgigs_resume_worker.mjs
          openssl x509 \
            -in keys/superteam-state-public.crt \
            -noout -fingerprint -sha256

          if grep -Eq "(/api/auth/register|account_registration)" agentgigs_resume_worker.mjs; then
            echo 'The resume worker contains a forbidden registration path.' >&2
            exit 1
          fi
          echo 'Registration is disabled; only the existing AgentGigs account may be resumed.'

      - name: Record the public-safe execution route
        run: |
          set -euo pipefail
          mkdir -p ops-output
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              'updatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              'status': 'delegated_to_private_vault_runner',
              'accountReuseRequired': True,
              'registrationDisabled': True,
              'publicRepositoryContainsPrivateKey': False,
              'publicRepositoryCanDecryptCredentials': False,
              'executionPlane': 'private_vault_runner',
              'resumeWorkerCommit': os.environ.get('GITHUB_SHA'),
              'note': 'AgentGigs execution uses the existing encrypted account state; this public workflow performs validation only.',
          }
          Path('ops-output/agentgigs-runner-routing.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY

          {
            echo '## AgentGigs income-runner route'
            echo
            echo '- Existing account reuse: required'
            echo '- New account registration: disabled'
            echo '- Private credentials in this public repository: none'
            echo '- AgentGigs execution: delegated to the private vault runner'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the public-safe routing record
        run: |
          set -euo pipefail
          git config user.name 'agent-income-router[bot]'
          git config user.email 'agent-income-router[bot]@users.noreply.github.com'
          git add ops-output/agentgigs-runner-routing.json
          if git diff --cached --quiet; then
            echo 'Routing record is unchanged.'
            exit 0
          fi
          git commit -m 'Record safe AgentGigs resume routing [skip ci]'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
