name: Archimedes MSN-00014 CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "deliverables/archimedes-msn-00014/**"
      - ".github/workflows/archimedes-msn-00014-ci.yml"
  push:
    branches: [main]
    paths:
      - "deliverables/archimedes-msn-00014/**"
      - ".github/workflows/archimedes-msn-00014-ci.yml"

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deliverables/archimedes-msn-00014

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deliverables/archimedes-msn-00014/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt "coverage>=7,<8"

      - name: Compile and run tests with coverage
        run: |
          python -m compileall -q app tests
          python -m coverage run --source=app -m pytest -q
          python -m coverage report --fail-under=90
          python -m coverage json -o coverage.json

      - name: Generate OpenAPI document
        run: |
          python - <<'PY'
          import json
          from app.main import app
          with open("openapi.json", "w", encoding="utf-8") as handle:
              json.dump(app.openapi(), handle, indent=2, ensure_ascii=False)
              handle.write("\n")
          PY

      - name: Smoke-test a real Uvicorn process
        run: |
          set -euo pipefail
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8765 > /tmp/msn14-uvicorn.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused --retry-all-errors http://127.0.0.1:8765/health > /tmp/msn14-health.json
          curl --fail --silent --show-error 'http://127.0.0.1:8765/convert?domain=pressure&from_unit=psi&to_unit=kPa&value=35' > /tmp/msn14-convert.json
          python - <<'PY'
          import json
          health = json.load(open('/tmp/msn14-health.json', encoding='utf-8'))
          converted = json.load(open('/tmp/msn14-convert.json', encoding='utf-8'))
          assert health['status'] == 'ok'
          assert health['domain_count'] == 8
          assert converted['result_text'] == '241.31650526088'
          PY

      - name: Build and smoke-test Docker image
        run: |
          set -euo pipefail
          docker build --tag engineering-unit-api:msn-00014 .
          container_id=$(docker run --detach --publish 8766:8000 engineering-unit-api:msn-00014)
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8766/health > /tmp/msn14-docker-health.json; then
              ready=1
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' "$container_id" | grep -qx true; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs "$container_id"
            exit 1
          fi
          python - <<'PY'
          import json
          health = json.load(open('/tmp/msn14-docker-health.json', encoding='utf-8'))
          assert health['status'] == 'ok'
          assert health['unit_count'] == 114
          PY

      - name: Build deterministic submission package
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          included = [
              Path('.dockerignore'), Path('Dockerfile'), Path('LICENSE'), Path('README.md'),
              Path('SUBMISSION.md'), Path('TEST-EVIDENCE.json'), Path('app/__init__.py'),
              Path('app/conversions.py'), Path('app/main.py'), Path('coverage.json'),
              Path('openapi.json'), Path('pyproject.toml'), Path('requirements-dev.txt'),
              Path('requirements.txt'), Path('tests/test_api.py'), Path('tests/test_conversions.py'),
          ]
          manifest = {
              'schema_version': 'archimedes-msn-00014-manifest-v1',
              'bounty_display_id': 'MSN-00014',
              'file_count': len(included),
              'files': [],
          }
          for path in included:
              data = path.read_bytes()
              manifest['files'].append({
                  'path': path.as_posix(),
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          Path('MANIFEST.json').write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )

          dist = Path('dist')
          dist.mkdir(exist_ok=True)
          archive = dist / 'archimedes-msn-00014-engineering-unit-api.zip'
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted([Path('MANIFEST.json'), *included], key=lambda item: item.as_posix()):
                  info = zipfile.ZipInfo(path.as_posix(), date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = (0o100644 & 0xFFFF) << 16
                  info.create_system = 3
                  zf.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (dist / 'SHA256SUMS.txt').write_text(f'{digest}  {archive.name}\n', encoding='utf-8')
          print(digest)
          PY

      - name: Upload submission evidence
        uses: actions/upload-artifact@v4
        with:
          name: archimedes-msn-00014-submission
          path: |
            deliverables/archimedes-msn-00014/dist/archimedes-msn-00014-engineering-unit-api.zip
            deliverables/archimedes-msn-00014/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
