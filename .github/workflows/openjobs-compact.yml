name: Compact OpenJobs evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - openjobs_compact.py
      - openjobs-output/live.json
      - .github/workflows/openjobs-compact.yml

permissions:
  contents: write

concurrency:
  group: openjobs-compact
  cancel-in-progress: true

jobs:
  compact:
    if: github.repository_owner == 'nexaworks-jp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile openjobs_compact.py
      - run: python3 openjobs_compact.py
      - name: Commit compact evidence
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add openjobs-output/compact.json
          if git diff --cached --quiet; then
            echo 'No compact evidence changes'
          else
            git commit -m 'Compact OpenJobs inventory evidence [skip ci]'
            git pull --rebase origin main
            git push
          fi
