name: Extract compact Callboard worker contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - callboard_compact_contract.py
      - .github/workflows/callboard-compact-contract.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate and extract exact worker endpoints
        run: |
          set -euo pipefail
          python3 -m py_compile callboard_compact_contract.py
          python3 callboard_compact_contract.py

      - name: Verify and commit compact contract
        run: |
          set -euo pipefail
          test -f market-output/callboard-worker-contract.json
          ! grep -Eq 'Authorization: Bearer|cb_[A-Za-z0-9._~+/=-]{8,}|0x[0-9a-fA-F]{64}' market-output/callboard-worker-contract.json
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add market-output/callboard-worker-contract.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record compact Callboard worker contract [skip ci]'
            git pull --rebase origin main
            git push
          fi
