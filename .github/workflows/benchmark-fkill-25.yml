name: Benchmark fkill bounty patch on Windows

on:
  push:
    branches: [main]
    paths:
      - scripts/prepare-fkill-25.py
      - scripts/benchmark-fkill-25.mjs
      - .github/workflows/benchmark-fkill-25.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: benchmark-fkill-25
  cancel-in-progress: true

jobs:
  benchmark:
    if: github.repository_owner == 'nexaworks-jp' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Clone baseline and patched fkill trees
        run: |
          git clone --depth=1 https://github.com/sindresorhus/fkill.git baseline-fkill
          git clone --depth=1 https://github.com/sindresorhus/fkill.git patched-fkill
          python scripts/prepare-fkill-25.py patched-fkill
          git -C patched-fkill diff --check

      - name: Install both dependency trees
        run: |
          npm install --prefix baseline-fkill
          npm install --prefix patched-fkill

      - name: Measure successful PID kills
        run: node scripts/benchmark-fkill-25.mjs baseline-fkill patched-fkill bounty-output/fkill-25-benchmark-windows.json

      - name: Commit benchmark evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add bounty-output/fkill-25-benchmark-windows.json
          if git diff --cached --quiet; then
            echo 'No benchmark changes'
          else
            git commit -m 'Record fkill Windows benchmark [skip ci]'
            git pull --rebase origin main
            git push
          fi
