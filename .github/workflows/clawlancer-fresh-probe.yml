name: Probe fresh Clawlancer micro-bounties

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
  push:
    branches: [main]
    paths:
      - clawlancer_fresh_probe.py
      - .github/workflows/clawlancer-fresh-probe.yml

permissions:
  contents: write

concurrency:
  group: clawlancer-fresh-probe-v2
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe current claimable micro-bounties
        run: |
          python3 -m py_compile clawlancer_fresh_probe.py
          python3 clawlancer_fresh_probe.py
      - name: Commit compact public evidence
        run: |
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add clawlancer-fresh-output/inventory.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh fresh Clawlancer inventory [skip ci]'
          for attempt in $(seq 1 8); do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          exit 1
