name: Build and validate Signal Panic Taskmarket artifact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - deliverables/taskmarket-signal-panic/source.html
      - scripts/build_signal_panic.py
      - .github/workflows/taskmarket-signal-panic-build.yml

permissions:
  contents: write

concurrency:
  group: taskmarket-signal-panic-build
  cancel-in-progress: true

jobs:
  build-and-test:
    if: github.repository == '2daime-same/autonomous-income-runner' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out dedicated repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch pinned official Three.js bundle and build one-file artifact
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          pushd "$work" >/dev/null
          tarball="$(npm pack three@0.158.0 --ignore-scripts --silent)"
          tar -xzf "$tarball" package/build/three.min.js
          cp package/build/three.min.js /tmp/three.min.js
          popd >/dev/null
          python -m py_compile scripts/build_signal_panic.py
          python scripts/build_signal_panic.py

      - name: Validate inline JavaScript syntax and single-file boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('deliverables/taskmarket-signal-panic/index.html')
          text = path.read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', text, flags=re.I)
          if len(scripts) != 2:
              raise SystemExit(f'expected exactly two inline scripts, found {len(scripts)}')
          for index, script in enumerate(scripts, 1):
              target = Path(f'/tmp/signal-panic-script-{index}.js')
              target.write_text(script, encoding='utf-8')
          if re.search(r'<script[^>]+src=', text, flags=re.I):
              raise SystemExit('runtime script src remains')
          if re.search(r'\b(?:src|href)=["\']https?://', text, flags=re.I):
              raise SystemExit('runtime external asset remains')
          PY
          node --check /tmp/signal-panic-script-1.js
          node --check /tmp/signal-panic-script-2.js

      - name: Install pinned Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run Chromium gameplay smoke test
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/signal-panic-smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const artifact = path.resolve('deliverables/taskmarket-signal-panic/index.html');
          const evidenceDir = path.resolve('/tmp/signal-panic-browser-evidence');
          fs.mkdirSync(evidenceDir, { recursive: true });

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 960 }, deviceScaleFactor: 1 });
          const errors = [];
          const requests = [];
          page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
          page.on('console', message => {
            if (message.type() === 'error') errors.push(`console: ${message.text()}`);
          });
          page.on('request', request => requests.push(request.url()));

          await page.goto(pathToFileURL(artifact).href, { waitUntil: 'load' });
          await page.waitForSelector('canvas');
          await page.waitForTimeout(1200);
          if (await page.locator('#fatal').isVisible()) errors.push('fatal Three.js fallback became visible');
          if (!(await page.locator('#startOverlay').isVisible())) errors.push('start overlay is not visible');
          await page.screenshot({ path: path.join(evidenceDir, 'start.png'), fullPage: true });

          await page.click('#startBtn');
          await page.waitForTimeout(2200);
          if (await page.locator('#startOverlay').isVisible()) errors.push('start overlay did not close');
          if (!(await page.locator('#controls').isVisible())) errors.push('signal controls are not visible');
          await page.keyboard.press('Digit2');
          await page.waitForTimeout(1100);
          const phaseAfterKey = (await page.locator('#phaseValue').textContent())?.trim() ?? '';
          if (!['CLEARING', 'ALL STOP', 'E / W GO'].includes(phaseAfterKey)) {
            errors.push(`unexpected phase after keyboard switch: ${phaseAfterKey}`);
          }
          await page.locator('#nsBtn').dispatchEvent('pointerdown');
          await page.waitForTimeout(900);
          const score = (await page.locator('#score').textContent())?.trim() ?? '';
          if (!/^\d{6,}$/.test(score)) errors.push(`score is not numeric: ${score}`);
          const pressure = (await page.locator('#pressureValue').textContent())?.trim() ?? '';
          if (!pressure) errors.push('queue pressure label is empty');
          await page.waitForTimeout(5200);
          await page.screenshot({ path: path.join(evidenceDir, 'running.png'), fullPage: true });

          const runtimeNetwork = requests.filter(url => /^https?:/i.test(url));
          if (runtimeNetwork.length) errors.push(`runtime network request(s): ${runtimeNetwork.join(', ')}`);

          const reportPath = path.resolve('deliverables/taskmarket-signal-panic/validation-report.json');
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          report.browser_smoke = errors.length ? 'failed' : 'passed';
          report.browser = {
            engine: 'chromium',
            version: browser.version(),
            viewport: '1440x960',
            runtime_network_requests: runtimeNetwork.length,
            phase_after_keyboard_switch: phaseAfterKey,
            queue_pressure_label: pressure,
            screenshot_names: ['start.png', 'running.png'],
          };
          report.browser_errors = errors;
          fs.writeFileSync(reportPath, `${JSON.stringify(report, null, 2)}\n`);
          await browser.close();
          if (errors.length) {
            console.error(errors.join('\n'));
            process.exit(1);
          }
          JS
          node /tmp/signal-panic-smoke.mjs

      - name: Verify no private material or forbidden runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          test -s deliverables/taskmarket-signal-panic/index.html
          test -s deliverables/taskmarket-signal-panic/validation-report.json
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          html = Path('deliverables/taskmarket-signal-panic/index.html').read_text(encoding='utf-8')
          report = json.loads(Path('deliverables/taskmarket-signal-panic/validation-report.json').read_text(encoding='utf-8'))
          if report.get('browser_smoke') != 'passed':
              raise SystemExit('browser smoke test did not pass')
          patterns = [
              r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',
              r'\bgh[pousr]_[A-Za-z0-9_]{20,}\b',
              r'github_pat_[A-Za-z0-9_]{20,}',
              r'\beyJ[A-Za-z0-9._-]{20,}\b',
          ]
          for pattern in patterns:
              if re.search(pattern, html):
                  raise SystemExit(f'credential-like material detected: {pattern}')
          if '<script src=' in html.lower():
              raise SystemExit('external script dependency remains')
          PY

      - name: Upload browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: signal-panic-browser-evidence
          path: /tmp/signal-panic-browser-evidence
          if-no-files-found: error
          retention-days: 7

      - name: Commit validated artifact and report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add deliverables/taskmarket-signal-panic/index.html deliverables/taskmarket-signal-panic/validation-report.json
          if git diff --cached --quiet; then
            echo 'Validated artifact is unchanged.'
            exit 0
          fi
          git commit -m 'Build validated Signal Panic submission artifact [skip ci]'
          for attempt in $(seq 1 8); do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          exit 1
