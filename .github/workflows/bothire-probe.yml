name: Probe BotHire API and package contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - bothire_probe.mjs
      - .github/workflows/bothire-probe.yml

permissions:
  contents: write

concurrency:
  group: bothire-contract-probe
  cancel-in-progress: true

jobs:
  probe:
    if: github.repository_owner == 'nexaworks-jp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate BotHire probe
        run: node --check bothire_probe.mjs

      - name: Inspect public BotHire docs, frontend contract, and npm package
        run: node bothire_probe.mjs

      - name: Fail closed on credential-like output
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path('market-output/bothire-contract.json')
          text = path.read_text(encoding='utf-8')
          checks = {
              'private key': re.compile(r'\b0x[0-9a-fA-F]{64}\b'),
              'credential prefix': re.compile(r'\b(?:bh|bothire|api|sk|pk)_[A-Za-z0-9._~+/=-]{8,}\b', re.I),
              'unredacted secret property': re.compile(r'(?i)"(?:apiKey|api_key|token|secret|authorization|privateKey|private_key|mnemonic|seed)"\s*:\s*"(?!\[REDACTED\])'),
          }
          for name, pattern in checks.items():
              if pattern.search(text):
                  raise SystemExit(f'{name} found in public BotHire evidence')
          PY

      - name: Commit sanitized BotHire evidence
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add market-output/bothire-contract.json
          if git diff --cached --quiet; then
            echo 'No BotHire evidence changes'
          else
            git commit -m 'Record BotHire public contract [skip ci]'
            git pull --rebase origin main
            git push
          fi
