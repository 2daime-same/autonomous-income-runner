name: Verify published MSN-00015 npm package

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: archimedes-msn-00015-published-package-verification
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == '2daime-same/autonomous-income-runner'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Node.js without credentials
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Verify public metadata, provenance, clean install, and MCP surface
        env:
          PACKAGE: archimedes-github-pr-mcp
          VERSION: 1.0.0
          EXPECTED_INTEGRITY: sha512-T7D4vVgc7WkdejZs210FtbOjifdImmbnl6VASOvpv84xXiwYwxhvKT6dmCUPOT+ZIXnN+tqggBYB/Fin6UH+tQ==
        run: |
          set -euo pipefail
          test -z "${NODE_AUTH_TOKEN:-}"
          test -z "${NPM_TOKEN:-}"
          npm view "$PACKAGE@$VERSION" --json > /tmp/published.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path('/tmp/published.json').read_text(encoding='utf-8'))
          if value.get('name') != os.environ['PACKAGE']:
              raise SystemExit('unexpected public package name')
          if value.get('version') != os.environ['VERSION']:
              raise SystemExit('unexpected public package version')
          dist = value.get('dist') or {}
          if dist.get('integrity') != os.environ['EXPECTED_INTEGRITY']:
              raise SystemExit('published package integrity changed')
          provenance = ((dist.get('attestations') or {}).get('provenance') or {}).get('predicateType')
          if provenance != 'https://slsa.dev/provenance/v1':
              raise SystemExit('SLSA provenance attestation is missing')
          PY

          rm -rf /tmp/msn15-public-install
          mkdir -p /tmp/msn15-public-install
          cd /tmp/msn15-public-install
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$PACKAGE@$VERSION"
          SERVER_PATH="$PWD/node_modules/$PACKAGE/dist/index.js"
          test -s "$SERVER_PATH"
          SERVER_PATH="$SERVER_PATH" node <<'NODE'
          import { spawn } from 'node:child_process';
          import readline from 'node:readline';

          const child = spawn(process.execPath, [process.env.SERVER_PATH], {
            env: {
              ...process.env,
              GITHUB_AUTH_MODE: 'none',
              GITHUB_ALLOW_WRITES: 'false',
              GITHUB_READ_TOKEN: '',
              GITHUB_WRITE_TOKEN: '',
              GITHUB_TOKEN: '',
            },
            stdio: ['pipe', 'pipe', 'inherit'],
          });
          const lines = readline.createInterface({ input: child.stdout, crlfDelay: Infinity });
          let id = 1;
          const pending = new Map();
          lines.on('line', (line) => {
            const value = JSON.parse(line);
            const waiter = pending.get(value.id);
            if (!waiter) return;
            pending.delete(value.id);
            value.error ? waiter.reject(new Error(JSON.stringify(value.error))) : waiter.resolve(value.result);
          });
          function request(method, params = {}) {
            const requestId = id++;
            return new Promise((resolve, reject) => {
              const timer = setTimeout(() => reject(new Error(`timeout: ${method}`)), 20_000);
              pending.set(requestId, {
                resolve(value) { clearTimeout(timer); resolve(value); },
                reject(error) { clearTimeout(timer); reject(error); },
              });
              child.stdin.write(`${JSON.stringify({ jsonrpc: '2.0', id: requestId, method, params })}\n`);
            });
          }
          const initialized = await request('initialize', {
            protocolVersion: '2025-06-18',
            capabilities: {},
            clientInfo: { name: 'public-registry-verifier', version: '1.0.0' },
          });
          child.stdin.write(`${JSON.stringify({ jsonrpc: '2.0', method: 'notifications/initialized', params: {} })}\n`);
          const tools = await request('tools/list');
          const prompts = await request('prompts/list');
          if (!initialized?.serverInfo || tools.tools?.length !== 8 || prompts.prompts?.length !== 2) {
            throw new Error('published package did not register the expected MCP surface');
          }
          child.stdin.end();
          setTimeout(() => child.kill('SIGTERM'), 250).unref();
          NODE
