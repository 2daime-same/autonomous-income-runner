name: Scan Taskmarket public and execution-grade opportunities

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - taskmarket_public_scan.py
      - taskmarket_execution_filter.py
      - taskmarket_target_probe.py
      - taskmarket-target-request.json
      - tests/test_taskmarket_execution_filter.py
      - .github/workflows/taskmarket-public-scan.yml
  schedule:
    - cron: '13 */4 * * *'

permissions:
  contents: write

concurrency:
  group: taskmarket-public-zero-spend-scan
  cancel-in-progress: true

jobs:
  scan:
    if: github.repository == '2daime-same/autonomous-income-runner' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test and compile scanners
        run: |
          python -m unittest tests/test_taskmarket_execution_filter.py -v
          python -m py_compile taskmarket_public_scan.py taskmarket_execution_filter.py taskmarket_target_probe.py

      - name: Fetch and rank public opportunities
        env:
          TASKMARKET_API_URL: https://api.taskmarket.dev
          TASKMARKET_PUBLIC_OUTPUT: taskmarket-output/public-scan.json
          TASKMARKET_MAX_PAGES: '10'
          TASKMARKET_PAGE_LIMIT: '100'
        run: python taskmarket_public_scan.py

      - name: Apply execution-route and expected-value gate
        env:
          TASKMARKET_PUBLIC_OUTPUT: taskmarket-output/public-scan.json
          TASKMARKET_EXECUTION_OUTPUT: taskmarket-output/executable-scan.json
        run: python taskmarket_execution_filter.py

      - name: Fetch exact selected task and public submission state
        env:
          TASKMARKET_API_URL: https://api.taskmarket.dev
          TASKMARKET_TARGET_REQUEST: taskmarket-target-request.json
          TASKMARKET_TARGET_OUTPUT: taskmarket-output/target-detail.json
        run: python taskmarket_target_probe.py

      - name: Reject credential-like output
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          paths = [
              Path('taskmarket-output/public-scan.json'),
              Path('taskmarket-output/executable-scan.json'),
              Path('taskmarket-output/target-detail.json'),
          ]
          patterns = {
              'JWT': re.compile(r'\beyJ[A-Za-z0-9._-]{20,}\b'),
              'credential field': re.compile(
                  r'(?i)"(?:api.?key|authorization|secret|token|password|cookie|private.?key|credential)"\s*:\s*"(?!\[REDACTED)'
              ),
              'private key block': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
          }
          for path in paths:
              text = path.read_text(encoding='utf-8')
              for name, pattern in patterns.items():
                  if pattern.search(text):
                      raise SystemExit(f'{name} found in public Taskmarket state: {path}')
          PY

      - name: Commit changed public evidence
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add \
            taskmarket-output/public-scan.json \
            taskmarket-output/executable-scan.json \
            taskmarket-output/target-detail.json
          if git diff --cached --quiet; then
            echo 'No substantive Taskmarket opportunity changes'
            exit 0
          fi
          git commit -m 'Refresh Taskmarket public and targeted evidence [skip ci]'
          for attempt in $(seq 1 8); do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          exit 1
