name: Select unresolved IssueHunt candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - select_issuehunt_candidates.py
      - .github/workflows/select-issuehunt-candidates.yml
      - market-output/trusted-bounties.json

permissions:
  contents: write

jobs:
  select:
    if: github.repository_owner == 'nexaworks-jp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile select_issuehunt_candidates.py
      - run: python3 select_issuehunt_candidates.py
      - name: Commit shortlist
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add market-output/issuehunt-uncontested.json
          if git diff --cached --quiet; then
            echo 'No shortlist changes'
          else
            git commit -m 'Refresh unresolved IssueHunt shortlist [skip ci]'
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 2))
            done
            exit 1
          fi
