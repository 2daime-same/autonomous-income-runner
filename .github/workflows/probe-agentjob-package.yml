name: Probe AgentJob published package

on:
  push:
    branches: [main]
    paths:
      - probe_agentjob_package.py
      - .github/workflows/probe-agentjob-package.yml
  workflow_dispatch:
  schedule:
    - cron: '11 */6 * * *'

permissions:
  contents: write

concurrency:
  group: probe-agentjob-package
  cancel-in-progress: true

jobs:
  probe:
    if: github.repository_owner == 'nexaworks-jp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile probe
        run: python3 -m py_compile probe_agentjob_package.py
      - name: Inspect package without executing it
        env:
          AGENTJOB_PROBE_OUTPUT: market-output/agentjob-package.json
        run: python3 probe_agentjob_package.py
      - name: Reject credential-shaped output
        run: |
          set -euo pipefail
          if grep -E -n '\b(aj|agentjob)_(live|test)_[A-Za-z0-9_-]+' market-output/agentjob-package.json; then
            echo 'Credential-shaped output detected' >&2
            exit 1
          fi
      - name: Commit package evidence
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add market-output/agentjob-package.json
          if git diff --cached --quiet; then
            echo 'No AgentJob package changes'
          else
            git commit -m 'Refresh AgentJob package evidence [skip ci]'
            git pull --rebase origin main
            git push
          fi