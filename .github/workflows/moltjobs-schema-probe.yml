name: Probe MoltJobs public API schema

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - moltjobs_schema_probe.py
      - .github/workflows/moltjobs-schema-probe.yml

permissions:
  contents: write

concurrency:
  group: moltjobs-schema-probe
  cancel-in-progress: true

jobs:
  probe:
    if: github.repository_owner == 'nexaworks-jp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile moltjobs_schema_probe.py
      - run: python3 moltjobs_schema_probe.py
      - name: Commit public schema evidence
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add moltjobs-output/schema-probe.json
          if git diff --cached --quiet; then
            echo 'No schema evidence changes'
          else
            git commit -m 'Record MoltJobs public schema evidence [skip ci]'
            git pull --rebase origin main
            git push
          fi
