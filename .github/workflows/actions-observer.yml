name: Observe fkill validation Actions

on:
  push:
    branches: [main]
    paths:
      - actions_observer.py
      - .github/workflows/actions-observer.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: observe-fkill-actions
  cancel-in-progress: true

jobs:
  observe:
    if: github.repository_owner == 'nexaworks-jp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compile observer
        run: python3 -m py_compile actions_observer.py

      - name: Read fkill validation runs and failed logs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIONS_OBSERVER_OUTPUT: ops-output/fkill-actions.json
        run: python3 actions_observer.py

      - name: Commit sanitized diagnostic evidence
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add ops-output/fkill-actions.json
          if git diff --cached --quiet; then
            echo 'No observer changes'
          else
            git commit -m 'Record fkill Actions diagnostics [skip ci]'
            git pull --rebase origin main
            git push
          fi
