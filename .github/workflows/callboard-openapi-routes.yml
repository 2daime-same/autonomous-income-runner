name: Probe Callboard route contracts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - callboard_openapi_routes_probe.py
      - .github/workflows/callboard-openapi-routes.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate and extract route schemas
        run: |
          set -euo pipefail
          python3 -m py_compile callboard_openapi_routes_probe.py
          python3 callboard_openapi_routes_probe.py

      - name: Verify read-only output and commit
        run: |
          set -euo pipefail
          test -f market-output/callboard-routes.json
          ! grep -Eq 'Authorization: Bearer|cb_[A-Za-z0-9._~+/=-]{8,}|0x[0-9a-fA-F]{64}' market-output/callboard-routes.json
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add market-output/callboard-routes.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record expanded Callboard route contracts [skip ci]'
            git pull --rebase origin main
            git push
          fi
