name: BountyHub funded candidate selector

on:
  push:
    branches: [main]
    paths:
      - bountyhub_selector.py
      - github_bounty_radar.py
      - tests/test_bountyhub_selector.py
      - .github/workflows/bountyhub-selector.yml
  workflow_dispatch:
  schedule:
    - cron: '19 */3 * * *'

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: bountyhub-selector-main
  cancel-in-progress: true

jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out dedicated repository
        uses: actions/checkout@v4

      - name: Test BountyHub selector
        run: python3 -m unittest discover -s tests -p 'test_bountyhub_selector.py' -v

      - name: Compile BountyHub selector
        run: python3 -m py_compile bountyhub_selector.py github_bounty_radar.py

      - name: Validate funded BountyHub tasks against GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOUNTYHUB_OUTPUT: market-output/bountyhub-candidates.json
        run: python3 bountyhub_selector.py

      - name: Commit public candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add market-output/bountyhub-candidates.json
          if git diff --cached --quiet; then
            echo 'No BountyHub candidate changes'
          else
            git commit -m 'Refresh BountyHub funded candidates [skip ci]'
            git pull --rebase origin main
            git push
          fi
