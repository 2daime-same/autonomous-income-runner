name: Build compact Taskmarket shortlist view

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - taskmarket_shortlist_brief.py
      - .github/workflows/taskmarket-shortlist-brief.yml
  workflow_run:
    workflows: ['Build current Taskmarket direct-submission shortlist']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: taskmarket-shortlist-brief
  cancel-in-progress: true

jobs:
  brief:
    if: >-
      github.repository == '2daime-same/autonomous-income-runner' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Create compact view
        run: |
          set -euo pipefail
          test -s taskmarket-output/live-open-shortlist.json
          python -m py_compile taskmarket_shortlist_brief.py
          python taskmarket_shortlist_brief.py

      - name: Commit compact evidence
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add taskmarket-output/live-open-brief.json
          if git diff --cached --quiet; then
            echo 'Compact view is unchanged.'
            exit 0
          fi
          git commit -m 'Refresh compact Taskmarket shortlist [skip ci]'
          for attempt in $(seq 1 8); do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          exit 1
