name: Probe Clawlancer live bounties

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - clawlancer_probe.py
      - .github/workflows/clawlancer-probe.yml

permissions:
  contents: write

concurrency:
  group: clawlancer-live-probe
  cancel-in-progress: true

jobs:
  probe:
    if: github.repository_owner == 'nexaworks-jp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile clawlancer_probe.py
      - run: python3 clawlancer_probe.py
      - name: Commit sanitized public evidence
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add clawlancer-output/live-probe.json
          if git diff --cached --quiet; then
            echo 'No public evidence changes'
          else
            git commit -m 'Record Clawlancer live bounty evidence [skip ci]'
            git pull --rebase origin main
            git push
          fi
