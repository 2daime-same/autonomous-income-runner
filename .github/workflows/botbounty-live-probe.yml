name: Probe BotBounty live inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - botbounty_live_probe.py
      - .github/workflows/botbounty-live-probe.yml

permissions:
  contents: write

concurrency:
  group: botbounty-live-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate and inspect public BotBounty inventory
        run: |
          set -euo pipefail
          python3 -m py_compile botbounty_live_probe.py
          python3 botbounty_live_probe.py

      - name: Commit current inventory evidence
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add market-output/botbounty-live.json market-output/botbounty-skill.md
          if git diff --cached --quiet; then
            echo 'No BotBounty inventory changes'
          else
            git commit -m 'Record BotBounty live inventory [skip ci]'
            git pull --rebase origin main
            git push
          fi
