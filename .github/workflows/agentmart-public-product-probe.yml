name: Verify AgentMart product public visibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/agentmart-public-product-probe.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify public marketplace and product page
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          product_name = 'Agent Bounty Verification and Safety Kit'
          slug = 'boundaryledger-toolsmith'
          product_page = 'https://agentmart.store/store/boundaryledger-toolsmith/products/agent-bounty-verification-and-safety-kit'

          def get(url):
              req = urllib.request.Request(url, headers={
                  'Accept': 'application/json,text/html;q=0.9,*/*;q=0.8',
                  'User-Agent': 'boundaryledger-agentmart-public-product-probe/1.0',
              })
              with urllib.request.urlopen(req, timeout=60) as response:
                  raw = response.read().decode('utf-8', errors='replace')
                  return response.status, response.headers.get('content-type', ''), raw

          query = urllib.parse.urlencode({'q': product_name, 'limit': 50})
          discover_url = 'https://agentmart.store/api/discover/products?' + query
          discover_status, discover_type, discover_raw = get(discover_url)
          discover_payload = json.loads(discover_raw)

          def walk(value):
              if isinstance(value, dict):
                  yield value
                  for item in value.values():
                      yield from walk(item)
              elif isinstance(value, list):
                  for item in value:
                      yield from walk(item)

          matches = []
          for item in walk(discover_payload):
              name = str(item.get('name') or item.get('title') or '')
              item_slug = str(item.get('slug') or item.get('product_slug') or '')
              seller_slug = str(item.get('store_slug') or item.get('seller_slug') or '')
              if product_name.lower() in name.lower() or item_slug == 'agent-bounty-verification-and-safety-kit':
                  matches.append({
                      'name': name,
                      'product_slug': item_slug,
                      'seller_slug': seller_slug,
                      'price': item.get('price'),
                      'status': item.get('status'),
                  })

          page_status, page_type, page_raw = get(product_page)
          result = {
              'generated_at': datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              'product_name': product_name,
              'seller_slug': slug,
              'discover_http_status': discover_status,
              'discover_content_type': discover_type,
              'public_search_match_count': len(matches),
              'public_search_matches': matches[:5],
              'product_page_http_status': page_status,
              'product_page_content_type': page_type,
              'product_name_visible_in_page': product_name.lower() in page_raw.lower(),
              'seller_slug_visible_in_page': slug in page_raw.lower(),
              'writes_performed': [],
          }
          path = Path('agentmart-output/public-product-probe.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Commit public visibility evidence
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add agentmart-output/public-product-probe.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record AgentMart public product visibility [skip ci]'
            git pull --rebase origin main
            git push
          fi
