name: Run BotBounty zero-spend worker

on:
  workflow_dispatch:
  schedule:
    - cron: '7 */4 * * *'

permissions:
  contents: write
  models: read

concurrency:
  group: botbounty-zero-spend-worker
  cancel-in-progress: true

jobs:
  earn:
    if: github.repository == '2daime-same/autonomous-income-runner' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate worker
        run: |
          set -euo pipefail
          python -m py_compile botbounty_worker.py

      - name: Configure evidence commits
        run: |
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'

      - name: Check, claim, build, submit, and verify Base payment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOTBOUNTY_MODEL: openai/gpt-4.1-mini
          BOTBOUNTY_WALLET: '0x130C29B253B3079FB9ec0D141a4603579Fe5B4d8'
          MAX_RUNTIME_MINUTES: '20'
        run: python botbounty_worker.py

      - name: Fail closed on public credential leakage
        if: always()
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          paths = [
              Path('botbounty-output/public-state.json'),
              Path('botbounty-output/handled-bounties.json'),
          ]
          patterns = {
              'JWT': re.compile(r'\beyJ[A-Za-z0-9._-]{20,}\b'),
              'private key': re.compile(r'\b0x[0-9a-fA-F]{64}\b'),
              'unredacted credential field': re.compile(
                  r'(?i)"(?:api.?key|authorization|secret|token|password|cookie|private|credential)"\s*:\s*"(?!\[REDACTED\])'
              ),
          }
          for path in paths:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              for name, pattern in patterns.items():
                  if pattern.search(text):
                      raise SystemExit(f'{name} found in public BotBounty state: {path}')
          PY
