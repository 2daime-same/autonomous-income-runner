name: Audit current Archimedes funded bounties

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - archimedes_live_search.py
      - .github/workflows/archimedes-live-search.yml

permissions:
  contents: write

concurrency:
  group: archimedes-live-read-only-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          package-manager-cache: false

      - name: Validate scanner
        run: python3 -m py_compile archimedes_live_search.py

      - name: Query official public MCP endpoint once
        run: python3 archimedes_live_search.py

      - name: Validate public evidence
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path('market-output/archimedes-live.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['mode'] == 'public_read_only_one_shot'
          assert data['commercial_status']['submission_performed'] is False
          assert data['commercial_status']['account_action_performed'] is False
          assert data['commercial_status']['expenses_usd'] == 0
          text = path.read_text(encoding='utf-8')
          patterns = [
              re.compile(r'(?i)authorization\s*[:=]'),
              re.compile(r'(?i)bearer\s+[A-Za-z0-9._~+/=-]{16,}'),
              re.compile(r'\b(?:sk|pk|ghp|gho|ghs|github_pat)_[A-Za-z0-9_=-]{16,}\b'),
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
          ]
          if any(pattern.search(text) for pattern in patterns):
              raise SystemExit('credential-like material found in public evidence')
          print(json.dumps({
              'candidate_records': data['deduped_candidate_record_count'],
              'identifiers': len(data['identifiers']),
              'detail_records': len(data['details']),
          }, sort_keys=True))
          PY

      - name: Commit changed public inventory
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add market-output/archimedes-live.json
          if git diff --cached --quiet; then
            echo 'No inventory change.'
            exit 0
          fi
          git commit -m 'Refresh official Archimedes live inventory [skip ci]'
          for attempt in $(seq 1 12); do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          exit 1
