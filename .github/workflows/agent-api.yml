name: Agent income API runner

on:
  push:
    branches: [main]
    paths:
      - request.json
      - runner.py
      - tests/**
      - keys/superteam-state-public.crt
      - .github/workflows/agent-api.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-income-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    if: github.repository_owner == 'nexaworks-jp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out isolated runner repository
        uses: actions/checkout@v4

      - name: Run local safety tests
        run: python3 -m unittest discover -s tests -v

      - name: Compile runner
        run: python3 -m py_compile runner.py

      - name: Validate request without network access
        run: python3 runner.py --dry-run

      - name: Execute requested agent API operation
        id: agent
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
          PUBLIC_SAFE_MODE: "1"
          AGENT_STATE_DIR: .agent-state
          AGENT_OUTPUT_DIR: output
          AGENT_REQUEST_FILE: request.json
        run: python3 runner.py

      - name: Encrypt private registration state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          if [[ -f .agent-state/superteam.json ]]; then
            openssl cms -encrypt \
              -binary \
              -aes-256-cbc \
              -in .agent-state/superteam.json \
              -out output/private-state.cms \
              -outform DER \
              keys/superteam-state-public.crt
            sha256sum output/private-state.cms > output/private-state.cms.sha256
            rm -f .agent-state/superteam.json
          fi
          rm -rf .agent-state

      - name: Verify that public JSON contains no credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          sensitive = {
              "access_token", "apikey", "api_key", "authorization",
              "bearertoken", "bearer_token", "claimcode", "claim_code",
              "human_privy_token", "privy_token", "refresh_token",
              "secret", "token",
          }
          problems = []

          def walk(value, path):
              if isinstance(value, dict):
                  for raw_key, item in value.items():
                      key = str(raw_key).replace("-", "_").lower()
                      child = f"{path}.{raw_key}"
                      if key in sensitive and item not in (None, "", "[REDACTED]"):
                          problems.append(child)
                      walk(item, child)
              elif isinstance(value, list):
                  for index, item in enumerate(value):
                      walk(item, f"{path}[{index}]")
              elif isinstance(value, str) and value.startswith("sk_"):
                  problems.append(path)

          for file in Path("output").glob("*.json"):
              walk(json.loads(file.read_text(encoding="utf-8")), file.name)

          if problems:
              raise SystemExit("Potential credential in public JSON: " + ", ".join(problems))
          PY

      - name: Commit sanitized evidence and encrypted state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "agent-income-runner[bot]"
          git config user.email "agent-income-runner[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Record agent API result [skip ci]"
            git push
          fi

      - name: Preserve runner failure status
        if: steps.agent.outcome == 'failure'
        run: exit 1
