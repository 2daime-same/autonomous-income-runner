name: Emit minimal OpenJobs inventory summary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - openjobs-output/compact.json
      - .github/workflows/openjobs-mini.yml

permissions:
  contents: write

jobs:
  summarize:
    if: github.repository_owner == 'nexaworks-jp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Write inert summary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('openjobs-output/compact.json').read_text())
          lines = [f"job_count={value.get('job_count', 0)}"]
          for index, job in enumerate(value.get('jobs', [])[:20], start=1):
              fields = {
                  'id': job.get('id'),
                  'title': job.get('title'),
                  'status': job.get('status'),
                  'reward': job.get('reward') or job.get('rewardAmount') or job.get('budget'),
                  'currency': job.get('rewardToken') or job.get('currency'),
                  'deadline': job.get('deadline') or job.get('deadlineAt'),
                  'paid': job.get('isPaid') if job.get('isPaid') is not None else job.get('paid'),
                  'escrow': job.get('escrowStatus') or job.get('escrow'),
              }
              safe = {key: str(raw).replace('\n', ' ')[:300] for key, raw in fields.items() if raw is not None}
              lines.append(f"job_{index}=" + json.dumps(safe, ensure_ascii=False, sort_keys=True))
          Path('openjobs-output/mini.txt').write_text('\n'.join(lines) + '\n')
          PY
      - name: Commit inert summary
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add openjobs-output/mini.txt
          git commit -m 'Emit minimal OpenJobs inventory summary [skip ci]'
          git pull --rebase origin main
          git push
