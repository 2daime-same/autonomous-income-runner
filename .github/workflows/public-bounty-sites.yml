name: Public bounty marketplace discovery

on:
  push:
    branches: [main]
    paths:
      - public_bounty_site_probe.py
      - public_bounty_site_index.py
      - tests/test_public_bounty_site_probe.py
      - .github/workflows/public-bounty-sites.yml
  workflow_dispatch:
  schedule:
    - cron: '47 */6 * * *'

permissions:
  contents: write

concurrency:
  group: public-bounty-sites-main
  cancel-in-progress: true

jobs:
  discover:
    if: github.repository_owner == 'nexaworks-jp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out dedicated repository
        uses: actions/checkout@v4

      - name: Test public discovery probe
        run: python3 -m unittest discover -s tests -p 'test_public_bounty_site_probe.py' -v

      - name: Compile public discovery tools
        run: python3 -m py_compile public_bounty_site_probe.py public_bounty_site_index.py

      - name: Discover public marketplace APIs and issue links
        env:
          PUBLIC_BOUNTY_SITE_OUTPUT: market-output/public-bounty-sites.json
        run: python3 public_bounty_site_probe.py

      - name: Build compact marketplace index
        env:
          PUBLIC_BOUNTY_SITE_INPUT: market-output/public-bounty-sites.json
          PUBLIC_BOUNTY_SITE_INDEX: market-output/public-bounty-sites-summary.json
        run: python3 public_bounty_site_index.py

      - name: Commit public evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add market-output/public-bounty-sites.json market-output/public-bounty-sites-summary.json
          if git diff --cached --quiet; then
            echo 'No public marketplace evidence changes'
          else
            git commit -m 'Refresh compact public bounty evidence [skip ci]'
            git pull --rebase origin main
            git push
          fi
