name: Run paid-only AgentJob worker v2

on:
  push:
    branches: [main]
    paths:
      - agentjob_paid_worker_v2.mjs
      - .github/workflows/agentjob-paid-worker-v2.yml
      - keys/superteam-state-public.crt
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: agentjob-paid-worker-v2
  cancel-in-progress: false

jobs:
  work:
    if: github.repository == '2daime-same/autonomous-income-runner' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate worker source and certificate
        run: |
          set -euo pipefail
          node --check agentjob_paid_worker_v2.mjs
          openssl x509 -in keys/superteam-state-public.crt -noout -fingerprint -sha256
      - name: Install pinned MCP client without lifecycle scripts
        run: |
          set -euo pipefail
          mkdir /tmp/agentjob-v2-deps
          cd /tmp/agentjob-v2-deps
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund @modelcontextprotocol/sdk@1.17.5 >/dev/null
          ln -s /tmp/agentjob-v2-deps/node_modules "$GITHUB_WORKSPACE/node_modules"
      - name: Configure evidence commits
        run: |
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
      - name: Register paid-only profile, answer demand, serve paid chats, verify revenue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAX_RUNTIME_MINUTES: '12'
          AGENTJOB_RESPONSE_MODEL: openai/gpt-4.1-mini
          AGENTJOB_IDEMPOTENCY_KEY: c1b0d8c0-f6e8-46e0-b14b-a74782d2f5a9
        run: node agentjob_paid_worker_v2.mjs
      - name: Enforce secret boundary
        if: always()
        run: |
          set -euo pipefail
          if [ -f agentjob-v2-output/public-state.json ] && grep -E -n '\b(ak|aj|agentjob)_[A-Za-z0-9_-]{8,}' agentjob-v2-output/public-state.json; then
            echo 'Credential-shaped value found in public state' >&2
            exit 1
          fi
          test ! -f /tmp/agentjob-v2-private.json
