name: Publish evidence-backed engineering site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == '2daime-same/autonomous-income-runner' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate static site
        id: validate
        continue-on-error: true
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/robots.txt
          grep -Fq 'Verified commercial ledger' site/index.html
          grep -Fq 'Open a paid request' site/index.html
          if grep -Eqi '(gh[opsu]_[A-Za-z0-9_]{16,}|github_pat_[A-Za-z0-9_]{16,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' site/index.html; then
            echo 'Credential-like material found in static site' >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        id: setup
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        id: upload
        if: steps.validate.outcome == 'success' && steps.setup.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Record Pages run evidence
        if: always()
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          outcomes = {
              'validate': os.environ.get('VALIDATE_OUTCOME') or 'unknown',
              'setup': os.environ.get('SETUP_OUTCOME') or 'unknown',
              'upload': os.environ.get('UPLOAD_OUTCOME') or 'unknown',
              'deploy': os.environ.get('DEPLOY_OUTCOME') or 'unknown',
          }
          index = Path('site/index.html')
          payload = {
              'schema_version': 'income-runner-pages-run-v1',
              'recorded_at': datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              'workflow_run_id': int(os.environ['RUN_ID']),
              'source_commit': os.environ['SOURCE_SHA'],
              'page_url': os.environ.get('PAGE_URL') or None,
              'index_sha256': hashlib.sha256(index.read_bytes()).hexdigest(),
              'outcomes': outcomes,
              'success': all(outcomes[key] == 'success' for key in ('validate', 'setup', 'upload', 'deploy')),
              'commercial_status': {
                  'verified_income_jpy': 0,
                  'verified_receivable_jpy': 0,
                  'verified_spend_jpy': 0,
              },
          }
          Path('site/pages-run-summary.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          if payload['success']:
              Path('site/deployment.json').write_text(
                  json.dumps({
                      'schema_version': 'income-runner-pages-deployment-v1',
                      'deployed_at': payload['recorded_at'],
                      'page_url': payload['page_url'],
                      'workflow_run_id': payload['workflow_run_id'],
                      'source_commit': payload['source_commit'],
                      'index_sha256': payload['index_sha256'],
                      'commercial_status': payload['commercial_status'],
                  }, indent=2, sort_keys=True) + '\n',
                  encoding='utf-8',
              )
          PY
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add site/pages-run-summary.json
          [[ ! -f site/deployment.json ]] || git add site/deployment.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record GitHub Pages run result [skip ci]'
          for attempt in $(seq 1 10); do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          exit 1

      - name: Preserve deployment failure status
        if: >-
          steps.validate.outcome != 'success' ||
          steps.setup.outcome != 'success' ||
          steps.upload.outcome != 'success' ||
          steps.deployment.outcome != 'success'
        run: exit 1
