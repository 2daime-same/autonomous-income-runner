name: Publish evidence-backed engineering site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == '2daime-same/autonomous-income-runner' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate static site
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/robots.txt
          grep -Fq 'Verified commercial ledger' site/index.html
          grep -Fq 'Paid engineering request' site/index.html
          if grep -Eqi '(gh[opsu]_[A-Za-z0-9_]{16,}|github_pat_[A-Za-z0-9_]{16,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' site/index.html; then
            echo 'Credential-like material found in static site' >&2
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record deployment evidence
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          index = Path('site/index.html')
          payload = {
              'schema_version': 'income-runner-pages-deployment-v1',
              'deployed_at': datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              'page_url': os.environ['PAGE_URL'],
              'workflow_run_id': int(os.environ['RUN_ID']),
              'source_commit': os.environ['SOURCE_SHA'],
              'index_sha256': hashlib.sha256(index.read_bytes()).hexdigest(),
              'commercial_status': {
                  'verified_income_jpy': 0,
                  'verified_receivable_jpy': 0,
                  'verified_spend_jpy': 0,
              },
          }
          Path('site/deployment.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add site/deployment.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record GitHub Pages deployment [skip ci]'
          for attempt in $(seq 1 10); do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          exit 1
