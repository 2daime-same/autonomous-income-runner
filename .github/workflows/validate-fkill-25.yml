name: Validate fkill IssueHunt bounty 25

on:
  push:
    branches: [main]
    paths:
      - scripts/prepare-fkill-25.py
      - .github/workflows/validate-fkill-25.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-fkill-25
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Check out income runner
        uses: actions/checkout@v4

      - name: Clone current fkill main
        run: git clone --depth=1 https://github.com/sindresorhus/fkill.git upstream-fkill

      - name: Apply candidate fix and regression test
        run: python scripts/prepare-fkill-25.py upstream-fkill

      - name: Check patch formatting
        working-directory: upstream-fkill
        run: git diff --check

      - name: Install dependencies
        working-directory: upstream-fkill
        run: npm install

      - name: Run complete upstream test script on Linux
        if: runner.os != 'Windows'
        working-directory: upstream-fkill
        run: npm test

      - name: Lint changed JavaScript on Windows
        if: runner.os == 'Windows'
        working-directory: upstream-fkill
        run: npx xo index.js test.js

      - name: Run Windows-relevant runtime regression tests
        if: runner.os == 'Windows'
        working-directory: upstream-fkill
        run: node --test --test-timeout=60000 --test-name-pattern="pid|title - windows|default ignore case - windows|title without extension - windows|successful kills are preserved when another input is missing" test.js

      - name: Run type-definition tests on Windows
        if: runner.os == 'Windows'
        working-directory: upstream-fkill
        run: npx tsd

  record:
    name: Record reproducible patch evidence
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out income runner
        uses: actions/checkout@v4

      - name: Rebuild exact patch
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/sindresorhus/fkill.git upstream-fkill
          python scripts/prepare-fkill-25.py upstream-fkill
          mkdir -p bounty-output
          git -C upstream-fkill diff --binary > bounty-output/fkill-25.patch
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          upstream = subprocess.check_output(
              ['git', '-C', 'upstream-fkill', 'rev-parse', 'HEAD'], text=True
          ).strip()
          result = {
              'generated_at': datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              'issue': 'https://github.com/sindresorhus/fkill/issues/25',
              'issuehunt_reward_usd': 8,
              'upstream_commit': upstream,
              'matrix_result': os.environ['MATRIX_RESULT'],
              'run_id': os.environ['RUN_ID'],
              'run_url': os.environ['RUN_URL'],
              'head_sha': os.environ['HEAD_SHA'],
              'patch_file': 'bounty-output/fkill-25.patch',
              'claim_status': 'not-submitted',
              'validation_note': 'Linux runs the complete upstream npm test script. Windows runs changed-JS lint, the PID/name/mixed-input tests relevant to this optimization with per-test timeout, and tsd. Full Windows xo has an unrelated declaration-file project-service path defect.',
              'next_action': 'Submit only after both operating-system test jobs succeed and a fork/PR path is available.',
          }
          Path('bounty-output/fkill-25-result.json').write_text(
              json.dumps(result, indent=2) + '\n', encoding='utf-8'
          )
          PY
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}

      - name: Commit evidence
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add bounty-output/fkill-25.patch bounty-output/fkill-25-result.json
          if git diff --cached --quiet; then
            echo 'No patch evidence changes'
          else
            git commit -m 'Record fkill bounty patch validation [skip ci]'
            git pull --rebase origin main
            git push
          fi

      - name: Preserve matrix failure status
        if: needs.test.result != 'success'
        run: exit 1
