name: Probe private AgentGigs vault access

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/private-vault-access-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRIVATE_REPO_TOKEN: ${{ secrets.RECOVERY_BOT_PAT || secrets.GH_PAT || secrets.BOT_PAT || secrets.PERSONAL_ACCESS_TOKEN }}
    steps:
      - name: Confirm a cross-repository token is configured
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_TOKEN"
          echo 'A candidate private-repository token is configured; its value is not printed.'

      - name: Check out the public mission repository
        uses: actions/checkout@v6

      - name: Check out the private vault branch
        uses: actions/checkout@v6
        with:
          repository: 2daime-same/AIagent
          ref: income-vault
          token: ${{ env.PRIVATE_REPO_TOKEN }}
          path: .private-income-vault
          persist-credentials: false

      - name: Verify vault completeness and key pairing without exposing secrets
        run: |
          set -euo pipefail
          test -s .private-income-vault/.income-vault/superteam-state-private.pem.b64
          test -s .private-income-vault/.income-vault/agentgigs-private-state.cms.b64
          base64 -d .private-income-vault/.income-vault/superteam-state-private.pem.b64 > /tmp/income-vault-key.pem
          chmod 600 /tmp/income-vault-key.pem
          openssl pkey -in /tmp/income-vault-key.pem -pubout > /tmp/key.pub
          openssl x509 -in keys/superteam-state-public.crt -pubkey -noout > /tmp/cert.pub
          cmp /tmp/key.pub /tmp/cert.pub
          echo 'Private vault access and CMS key pairing verified.'

      - name: Remove private material
        if: always()
        run: |
          rm -rf .private-income-vault /tmp/income-vault-key.pem /tmp/key.pub /tmp/cert.pub
