name: Algora active bounty probe

on:
  push:
    branches: [main]
    paths:
      - algora_probe.mjs
      - .github/workflows/algora-probe.yml
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'

permissions:
  contents: write

concurrency:
  group: algora-probe-main
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository_owner == 'nexaworks-jp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out dedicated repository
        uses: actions/checkout@v4

      - name: Install Algora public SDK without lifecycle scripts
        run: npm install --no-save --ignore-scripts @algora/sdk@0.2.0

      - name: Fetch active rewarded Algora bounties
        env:
          ALGORA_OUTPUT_FILE: market-output/algora.json
        run: node algora_probe.mjs

      - name: Commit public bounty snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add market-output/algora.json
          if git diff --cached --quiet; then
            echo 'No Algora inventory changes'
          else
            git commit -m 'Refresh Algora bounty inventory [skip ci]'
            git pull --rebase origin main
            git push
          fi
