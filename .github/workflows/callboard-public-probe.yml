name: Probe Callboard public inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - callboard_public_probe.py
      - .github/workflows/callboard-public-probe.yml
  schedule:
    - cron: '29 */2 * * *'

permissions:
  contents: write

concurrency:
  group: callboard-public-probe
  cancel-in-progress: true

jobs:
  probe:
    if: github.repository == '2daime-same/autonomous-income-runner' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compile read-only Callboard probe
        run: python3 -m py_compile callboard_public_probe.py

      - name: Fetch Callboard public calls and stats
        env:
          CALLBOARD_PUBLIC_OUTPUT: market-output/callboard-public.json
        run: python3 callboard_public_probe.py

      - name: Reject credential-like public output
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('market-output/callboard-public.json').read_text(encoding='utf-8')
          patterns = [
              r'\b(?:sk|pk|api|key|token)_[A-Za-z0-9_-]{16,}\b',
              r'(?i)"(?:api[_-]?key|authorization|bearer|token|secret|private[_-]?key|claim[_-]?code)"\s*:\s*"(?!\[REDACTED\])',
              r'\b0x[a-fA-F0-9]{64}\b',
          ]
          hits = [pattern for pattern in patterns if re.search(pattern, text)]
          if hits:
              raise SystemExit(f'credential-like output detected: {hits}')
          PY

      - name: Commit sanitized Callboard evidence
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add market-output/callboard-public.json
          if git diff --cached --quiet; then
            echo 'No Callboard evidence changes'
          else
            git commit -m 'Refresh Callboard public inventory [skip ci]'
            for attempt in $(seq 1 8); do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep "$attempt"
            done
            exit 1
          fi
