name: Probe official Taskmarket CLI authentication and legal gates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/taskmarket_cli_probe_report.py
      - .github/workflows/taskmarket-cli-auth-probe.yml
  schedule:
    - cron: '19 1,7,13,19 * * *'

permissions:
  contents: write

concurrency:
  group: taskmarket-cli-auth-probe
  cancel-in-progress: true

jobs:
  probe-read-only:
    if: github.repository == '2daime-same/autonomous-income-runner' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install current official CLI without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm view @lucid-agents/taskmarket version dist.tarball dist.integrity --json > /tmp/taskmarket-npm-view.json
          npm install --no-save --ignore-scripts --no-audit --no-fund @lucid-agents/taskmarket@latest
          node -e "const p=require('./node_modules/@lucid-agents/taskmarket/package.json'); console.log(JSON.stringify({name:p.name,version:p.version,bin:p.bin},null,2))" > /tmp/taskmarket-package.json

      - name: Run help and legal-status commands with an empty isolated home
        shell: bash
        run: |
          set +e
          export HOME="$RUNNER_TEMP/taskmarket-empty-home"
          export XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME"
          CLI="./node_modules/.bin/taskmarket"
          for command in help legal-help legal-status-json legal-status; do
            case "$command" in
              help) args=(--help) ;;
              legal-help) args=(legal --help) ;;
              legal-status-json) args=(legal status --json) ;;
              legal-status) args=(legal status) ;;
            esac
            "$CLI" "${args[@]}" > "/tmp/taskmarket-$command.out" 2> "/tmp/taskmarket-$command.err"
            echo $? > "/tmp/taskmarket-$command.code"
          done
          exit 0

      - name: Inspect first-party package for authentication and legal contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('node_modules/@lucid-agents/taskmarket')
          pattern = re.compile(
              r'(I AGREE|LEGAL_ACCEPTANCE_REQUIRED|legal.{0,40}(?:status|accept|bundle|digest|version)|'
              r'/api/(?:devices|legal|tasks|submissions|identity)|apiToken|deviceId|deviceEncryptionKey|'
              r'x-taskmarket-api-token|Authorization|taskmarket:submit:|acceptance statement)',
              re.I,
          )
          rows = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.stat().st_size > 8_000_000:
                  continue
              if path.suffix.lower() not in {'.js', '.mjs', '.cjs', '.ts', '.json', '.md'}:
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              for number, line in enumerate(text.splitlines(), 1):
                  if pattern.search(line):
                      rows.append({
                          'path': str(path.relative_to(root)),
                          'line': number,
                          'excerpt': line.strip()[:1200],
                      })
                  if len(rows) >= 240:
                      break
              if len(rows) >= 240:
                  break
          Path('/tmp/taskmarket-package-contracts.json').write_text(
              json.dumps(rows, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Build credential-free public report
        run: |
          set -euo pipefail
          python -m py_compile scripts/taskmarket_cli_probe_report.py
          python scripts/taskmarket_cli_probe_report.py

      - name: Reject leaked credentials and false side-effect evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s taskmarket-output/cli-auth-probe.json
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          text = Path('taskmarket-output/cli-auth-probe.json').read_text(encoding='utf-8')
          value = json.loads(text)
          if value.get('network_writes_performed'):
              raise SystemExit('unexpected network-write evidence')
          if value.get('taskmarket_init_performed') or value.get('legal_acceptance_performed') or value.get('wallet_created'):
              raise SystemExit('probe incorrectly claims a mutating action')
          for pattern in (
              r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',
              r'\bgh[pousr]_[A-Za-z0-9_]{20,}\b',
              r'github_pat_[A-Za-z0-9_]{20,}',
              r'\beyJ[A-Za-z0-9._-]{20,}\b',
          ):
              if re.search(pattern, text):
                  raise SystemExit(f'credential-like material detected: {pattern}')
          PY

      - name: Commit current public probe evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add taskmarket-output/cli-auth-probe.json
          if git diff --cached --quiet; then
            echo 'CLI probe is unchanged.'
            exit 0
          fi
          git commit -m 'Refresh Taskmarket CLI auth and legal probe [skip ci]'
          for attempt in $(seq 1 8); do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          exit 1
