name: Probe AgentMart seller contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - agentmart_contract_probe.py
      - .github/workflows/agentmart-contract-probe.yml

permissions:
  contents: write

concurrency:
  group: agentmart-contract-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate and inspect only public AgentMart resources
        run: |
          set -euo pipefail
          python3 -m py_compile agentmart_contract_probe.py
          python3 agentmart_contract_probe.py

      - name: Commit read-only contract evidence
        run: |
          set -euo pipefail
          git config user.name 'agent-income-runner[bot]'
          git config user.email 'agent-income-runner[bot]@users.noreply.github.com'
          git add market-output/agentmart-contract.json market-output/agentmart-skill.md
          if git diff --cached --quiet; then
            echo 'No AgentMart contract changes'
          else
            git commit -m 'Record AgentMart seller contract [skip ci]'
            git pull --rebase origin main
            git push
          fi
